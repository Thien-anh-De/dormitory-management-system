name: Supabase Keep-Alive

on:
  schedule:
    # Ping every 3 days at 00:00 UTC to prevent Supabase Free Tier 7-day auto-pause
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        id: ping
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/system_config?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP_STATUS=$STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[CRITICAL] Supabase Keep-Alive Ping Failed',
              body: 'The scheduled keep-alive ping to Supabase failed. Please check Supabase Dashboard immediately to ensure the database is not paused.',
              labels: ['critical']
            });
